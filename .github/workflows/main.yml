name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Unity Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h
          
      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-
            
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Unity Setup  
        uses: xrtk/unity-setup@v7
        with:
          build-targets: ${{ env.ANDROID_BUILD_TARGET }}

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.20f1
          targetPlatform: ${{ env.ANDROID_BUILD_TARGET }}
          buildName: ArmyComander

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmyComander
          path: build/Android

      - name: Return Unity License
        if: always()
        uses: game-ci/unity-return-license@v2
