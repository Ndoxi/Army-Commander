name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Unity Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h
    
      - name: Checkout code
        uses: actions/checkout@v4
            
      - uses: xrtk/unity-setup@v7
        with:
          build-targets: ${{ env.ANDROID_BUILD_TARGET }}

      - name: Cache Library folder
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ env.ANDROID_BUILD_TARGET }}
          buildName: ArmyComander

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/Android/ArmyComander.apk

      - name: Return Unity License
        if: always()
        uses: game-ci/unity-return-license@v2
