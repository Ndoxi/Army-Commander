name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Unity Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
            
      - uses: xrtk/unity-setup@v7
        with:
          build-targets: ${{ env.ANDROID_BUILD_TARGET }}

      - name: Cache Library folder
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ env.ANDROID_BUILD_TARGET }}
          buildName: ArmyComander

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/Android/ArmyComander.apk

      - name: Return Unity License
        if: always()
        uses: game-ci/unity-return-license@v2
